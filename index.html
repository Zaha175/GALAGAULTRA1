                    showAchievement('Rising Star', 'Reached level 2!');
                }
                
                // Play level up sound
                playSound('levelUp');
            }
            
            // Show level up message
            function showLevelUpMessage() {
                // Create level up message
                const levelUpEl = document.createElement('div');
                levelUpEl.className = 'achievement';
                levelUpEl.style.animation = 'achievementSlide 3s ease-in-out forwards';
                
                // Create level icon
                const iconEl = document.createElement('div');
                iconEl.className = 'achievement-icon';
                iconEl.style.backgroundColor = '#4CAF50';
                
                // Create level text
                const textEl = document.createElement('span');
                textEl.textContent = `Level ${gameState.level}`;
                
                // Assemble and add to DOM
                levelUpEl.appendChild(iconEl);
                levelUpEl.appendChild(textEl);
                gameContainer.appendChild(levelUpEl);
                
                // Remove after animation finishes
                setTimeout(() => {
                    levelUpEl.remove();
                }, 3000);
            }
            
            // Show achievement
            function showAchievement(title, description) {
                // Create achievement element
                const achievementEl = document.createElement('div');
                achievementEl.className = 'achievement';
                
                // Create achievement icon
                const iconEl = document.createElement('div');
                iconEl.className = 'achievement-icon';
                
                // Create achievement text
                const textEl = document.createElement('span');
                textEl.innerHTML = `<strong>${title}</strong><br>${description}`;
                
                // Assemble and add to DOM
                achievementEl.appendChild(iconEl);
                achievementEl.appendChild(textEl);
                gameContainer.appendChild(achievementEl);
                
                // Remove after animation finishes
                setTimeout(() => {
                    achievementEl.remove();
                }, 4000);
                
                // Play achievement sound
                playSound('achievement');
            }
            
            // End game
            function endGame() {
                gameState.isRunning = false;
                
                // Add score to high scores
                addHighScore(gameState.score);
                
                // Update UI
                updateUI();
                
                // Show game over screen
                gameOver.style.display = 'flex';
                
                // Play game over sound
                playSound('gameOver');
            }
            
            // Add score to high scores
            function addHighScore(score) {
                // Get current high scores
                highScores.push({
                    score: score,
                    level: gameState.level,
                    date: new Date().toLocaleDateString()
                });
                
                // Sort and limit to top 5
                highScores.sort((a, b) => b.score - a.score);
                highScores = highScores.slice(0, 5);
                
                // Save to localStorage if available
                try {
                    localStorage.setItem('galagaHighScores', JSON.stringify(highScores));
                } catch (e) {
                    console.log('Could not save high scores to localStorage');
                }
                
                // Update high scores display
                updateHighScoresDisplay();
            }
            
            // Update high scores display
            function updateHighScoresDisplay() {
                highScoresList.innerHTML = '';
                
                if (highScores.length === 0) {
                    const listItem = document.createElement('li');
                    listItem.textContent = 'No scores yet';
                    highScoresList.appendChild(listItem);
                    return;
                }
                
                for (const score of highScores) {
                    const listItem = document.createElement('li');
                    const scoreSpan = document.createElement('span');
                    scoreSpan.textContent = score.score;
                    
                    const infoSpan = document.createElement('span');
                    infoSpan.textContent = `Level ${score.level}`;
                    
                    listItem.appendChild(scoreSpan);
                    listItem.appendChild(infoSpan);
                    highScoresList.appendChild(listItem);
                }
            }
            
            // Load high scores
            function loadHighScores() {
                try {
                    const savedScores = localStorage.getItem('galagaHighScores');
                    if (savedScores) {
                        highScores = JSON.parse(savedScores);
                        updateHighScoresDisplay();
                    }
                } catch (e) {
                    console.log('Could not load high scores from localStorage');
                }
            }
            
            // Pause game
            function pauseGame() {
                if (!gameState.isRunning) return;
                
                gameState.isPaused = true;
                pauseMenu.style.display = 'flex';
                pauseScore.textContent = gameState.score;
                
                // Cancel animation frame
                cancelAnimationFrame(animationFrameId);
            }
            
            // Resume game
            function resumeGame() {
                if (!gameState.isRunning) return;
                
                gameState.isPaused = false;
                pauseMenu.style.display = 'none';
                
                // Restart animation loop
                lastTime = performance.now();
                gameLoop();
            }
            
            // Simple sound effect system
            const soundEffects = {
                shoot: { frequency: 800, type: 'square', duration: 0.1 },
                hit: { frequency: 300, type: 'sawtooth', duration: 0.1 },
                explosion: { frequency: 100, type: 'sawtooth', duration: 0.3 },
                playerHit: { frequency: 150, type: 'square', duration: 0.3 },
                powerUp: { frequency: 600, type: 'sine', duration: 0.2 },
                levelUp: { frequency: 440, type: 'sine', duration: 0.6 },
                gameOver: { frequency: 200, type: 'triangle', duration: 1 },
                achievement: { frequency: 880, type: 'sine', duration: 0.4 },
                enemyShoot: { frequency: 500, type: 'square', duration: 0.05 },
                shieldHit: { frequency: 440, type: 'sine', duration: 0.15 },
                tractorBeam: { frequency: 220, type: 'sine', duration: 0.5 }
            };
            
            let audioContext;
            
            // Initialize audio context when needed
            function initAudio() {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            
            // Play sound effect
            function playSound(type) {
                try {
                    if (!audioContext) {
                        initAudio();
                    }
                    
                    const effect = soundEffects[type];
                    if (!effect) return;
                    
                    // Create oscillator
                    const oscillator = audioContext.createOscillator();
                    oscillator.type = effect.type;
                    
                    // Base frequency
                    let frequency = effect.frequency;
                    
                    // Special sound effects
                    if (type === 'levelUp') {
                        // Ascending tone
                        oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
                        oscillator.frequency.linearRampToValueAtTime(frequency * 2, audioContext.currentTime + effect.duration * 0.5);
                        oscillator.frequency.linearRampToValueAtTime(frequency * 3, audioContext.currentTime + effect.duration);
                    } else if (type === 'gameOver') {
                        // Descending tone
                        oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
                        oscillator.frequency.linearRampToValueAtTime(frequency * 0.5, audioContext.currentTime + effect.duration * 0.7);
                        oscillator.frequency.linearRampToValueAtTime(frequency * 0.2, audioContext.currentTime + effect.duration);
                    } else if (type === 'achievement') {
                        // Double beep
                        oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
                        oscillator.frequency.setValueAtTime(frequency * 1.5, audioContext.currentTime + effect.duration * 0.5);
                    } else {
                        oscillator.frequency.value = frequency;
                    }
                    
                    // Create gain node for volume control
                    const gainNode = audioContext.createGain();
                    gainNode.gain.setValueAtTime(0.8, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + effect.duration);
                    
                    // Connect nodes
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    // Start and stop
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + effect.duration);
                } catch (e) {
                    console.error('Error playing sound:', e);
                }
            }
            
            // Game loop
            let lastTime = 0;
            
            function gameLoop(timestamp) {
                // Calculate delta time
                if (!lastTime) lastTime = timestamp;
                const deltaTime = timestamp - lastTime;
                lastTime = timestamp;
                
                // Clear canvas
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Update game elements
                updateStars(deltaTime);
                updateCooldownBar();
                updatePlayer(deltaTime);
                updateBullets(deltaTime);
                updateEnemies(deltaTime);
                updatePowerUps(deltaTime);
                updateParticles(deltaTime);
                updateActivePowerUpsUI();
                
                // Check for spawning enemies
                if (gameState.enemies.length < 5 + gameState.level) {
                    createEnemy();
                }
                
                // Check collisions
                checkCollisions();
                
                // Render game elements
                drawStars();
                drawBullets();
                drawEnemies();
                drawPowerUps();
                drawParticles();
                drawPlayer();
                
                // Continue game loop
                if (gameState.isRunning && !gameState.isPaused) {
                    animationFrameId = requestAnimationFrame(gameLoop);
                }
            }
            
            // Start game
            function startGame() {
                // Initialize game state
                initGame();
                
                // Set game as running
                gameState.isRunning = true;
                gameState.isPaused = false;
                
                // Hide menus
                gameMenu.style.display = 'none';
                gameOver.style.display = 'none';
                pauseMenu.style.display = 'none';
                
                // Start game loop
                lastTime = performance.now();
                gameLoop(lastTime);
                
                // Initialize audio
                initAudio();
            }
            
            // Handle window resize
            function handleResize() {
                // Update game dimensions
                gameWidth = gameContainer.clientWidth;
                gameHeight = gameContainer.clientHeight;
                
                // Resize canvas
                canvas.width = gameWidth;
                canvas.height = gameHeight;
                
                // Update player position if it went off-screen after resize
                if (gameState.player) {
                    if (gameState.player.x + gameState.player.width > gameWidth) {
                        gameState.player.x = gameWidth - gameState.player.width;
                    }
                }
            }
            
            // Event listeners
            window.addEventListener('resize', handleResize);
            
            // Keyboard controls
            window.addEventListener('keydown', e => {
                keys[e.key] = true;
                
                // Shoot on space
                if (e.key === ' ' && gameState.isRunning && !gameState.isPaused) {
                    shoot();
                    e.preventDefault();
                }
                
                // Pause on P or Escape
                if ((e.key === 'p' || e.key === 'P' || e.key === 'Escape') && gameState.isRunning) {
                    if (gameState.isPaused) {
                        resumeGame();
                    } else {
                        pauseGame();
                    }
                    e.preventDefault();
                }
            });
            
            window.addEventListener('keyup', e => {
                keys[e.key] = false;
            });
            
            // Mouse controls
            gameCanvas.addEventListener('mousedown', e => {
                // Enable mouse control
                gameState.isMouseControl = true;
                gameState.mouseX = e.clientX - canvas.getBoundingClientRect().left;
                
                // Shoot on mouse click if game is running
                if (gameState.isRunning && !gameState.isPaused) {
                    shoot();
                }
            });
            
            gameCanvas.addEventListener('mousemove', e => {
                if (gameState.isMouseControl) {
                    gameState.mouseX = e.clientX - canvas.getBoundingClientRect().left;
                }
            });
            
            gameCanvas.addEventListener('mouseup', () => {
                // Keep mouse control enabled for smoother experience
                // Player can use keyboard anytime to override
            });
            
            // Keep tracking mouse even when outside canvas but mouse button is down
            window.addEventListener('mousemove', e => {
                if (gameState.isMouseControl) {
                    const canvasRect = canvas.getBoundingClientRect();
                    if (e.clientX >= canvasRect.left && e.clientX <= canvasRect.right) {
                        gameState.mouseX = e.clientX - canvasRect.left;
                    }
                }
            });
            
            window.addEventListener('mouseup', () => {
                // Don't disable mouse control on mouseup for better experience
                // This allows the player to move using the mouse without holding the button
            });
            
            // Touch controls
            gameCanvas.addEventListener('touchstart', e => {
                e.preventDefault();
                
                gameState.isTouchDevice = true;
                
                // Store first touch for movement
                if (e.touches.length > 0 && gameState.touchIdentifier === null) {
                    const touch = e.touches[0];
                    gameState.touchIdentifier = touch.identifier;
                    gameState.touchStartX = touch.clientX;
                    gameState.touchCurrentX = touch.clientX;
                }
                
                // Shoot on tap if game is running
                if (gameState.isRunning && !gameState.isPaused) {
                    shoot();
                }
            });
            
            gameCanvas.addEventListener('touchmove', e => {
                e.preventDefault();
                
                // Update touch position for movement
                if (gameState.touchIdentifier !== null) {
                    for (let i = 0; i < e.touches.length; i++) {
                        const touch = e.touches[i];
                        if (touch.identifier === gameState.touchIdentifier) {
                            gameState.touchCurrentX = touch.clientX;
                            break;
                        }
                    }
                }
            });
            
            gameCanvas.addEventListener('touchend', e => {
                e.preventDefault();
                
                // Check if the primary touch ended
                let primaryTouchEnded = true;
                for (let i = 0; i < e.touches.length; i++) {
                    if (e.touches[i].identifier === gameState.touchIdentifier) {
                        primaryTouchEnded = false;
                        break;
                    }
                }
                
                if (primaryTouchEnded) {
                    gameState.touchIdentifier = null;
                }
            });
            
            // Button event listeners
            document.querySelectorAll('.difficulty-container .btn').forEach(btn => {
                btn.addEventListener('click', e => {
                    gameState.difficulty = e.target.dataset.difficulty;
                    startGame();
                });
            });
            
            restartBtn.addEventListener('click', () => {
                startGame();
            });
            
            menuBtn.addEventListener('click', () => {
                gameOver.style.display = 'none';
                gameMenu.style.display = 'flex';
                updateHighScoresDisplay();
            });
            
            resumeBtn.addEventListener('click', () => {
                resumeGame();
            });
            
            quitBtn.addEventListener('click', () => {
                gameState.isRunning = false;
                pauseMenu.style.display = 'none';
                gameMenu.style.display = 'flex';
                updateHighScoresDisplay();
            });
            
            // Load high scores if available
            loadHighScores();
            
            // Handle initial window size
            handleResize();
        });
    </script>
</body>
</html>
